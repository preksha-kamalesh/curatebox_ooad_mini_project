<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | CurateBox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container animate-slide-up" style="max-width: 560px; margin-top: 8vh;">
    <div class="glass-card p-5">
        <div class="text-center mb-4">
            <h2 class="mb-2"><i class="fa-solid fa-user-shield me-2"></i>Admin Login</h2>
            <p class="text-muted mb-0">Sign in to access dashboard, customers, and inventory modules.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" type="text" class="form-control" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" style="background-color: var(--primary); border: none;">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Login as Admin
            </button>
        </form>

        <div class="mt-4 small text-muted">
            Demo seed credentials: <strong>admin</strong> / <strong>admin123</strong>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
